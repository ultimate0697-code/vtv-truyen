<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Truyền lên TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#fff;text-align:center}
h1{font-size:22px;margin:10px 0}
#st{padding:10px;border-radius:10px;background:#171f3a;color:#ffd54f;margin-bottom:20px}
#st.ok{color:#69f0ae}
button,label.btn{display:block;width:100%;padding:18px;margin:12px 0;border:0;border-radius:14px;background:#2979ff;color:#fff;font-size:18px;font-weight:600}
button.alt{background:#37415f}
button:disabled,label.btn.dis{opacity:.4;pointer-events:none}
video{width:100%;border-radius:12px;background:#000;margin-top:10px}
#pr{height:8px;background:#171f3a;border-radius:4px;overflow:hidden;margin-top:6px}
#pr i{display:block;height:100%;width:0;background:#69f0ae}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Truyền lên TV</h1>
<div id="st">Đang kết nối…</div>

<div id="img" hidden>
  <label class="btn dis" id="pick">Chọn ảnh / video
    <input id="file" type="file" accept="image/*,video/*" multiple hidden>
  </label>
  <div id="pr"><i></i></div>
  <p id="sent"></p>
</div>

<div id="live" hidden>
  <button id="cam" disabled>Bật camera</button>
  <button id="flip" class="alt" hidden>Đổi camera trước/sau</button>
  <button id="off" class="alt" hidden>Dừng phát</button>
  <video id="pv" muted playsinline autoplay hidden></video>
</div>

<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var topic = Q.get('t'), mode = Q.get('m') === 'live' ? 'live' : 'img';
  var SIGNAL = 'https://ntfy.sh/', STUN = ['stun:stun.l.google.com:19302'];
  var $ = function (id) { return document.getElementById(id); };
  var pc = null, dc = null, tr = null, es = null, buf = {}, facing = 'environment', stream = null, helloTimer = null, gotOffer = false;
  function st(t, ok) { $('st').textContent = t; $('st').className = ok ? 'ok' : ''; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rnd(n) { var s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.slice(0, n); }

  if (!topic) { st('Mã QR không hợp lệ, hãy quét lại trên TV'); return; }
  $(mode).hidden = false;

  async function pub(m) {
    var s = JSON.stringify(m), id = rnd(4), n = Math.ceil(s.length / 2500);
    for (var i = 0; i < n; i++)
      await fetch(SIGNAL + topic, { method: 'POST', body: JSON.stringify({ id: id, i: i, n: n, d: s.slice(i * 2500, (i + 1) * 2500), f: 'ph' }) });
  }
  function sub(cb) {
    es = new EventSource(SIGNAL + topic + '/sse');
    es.onmessage = function (e) {
      var m; try { m = JSON.parse(JSON.parse(e.data).message); } catch (x) { return; }
      if (!m || m.f === 'ph') return;
      var a = buf[m.id] = buf[m.id] || [], got = 0; a[m.i] = m.d;
      for (var k = 0; k < a.length; k++) if (a[k] != null) got++;
      if (got === m.n) { delete buf[m.id]; try { cb(JSON.parse(a.join(''))); } catch (x) {} }
    };
  }
  function waitIce(p) {
    return new Promise(function (res) {
      if (p.iceGatheringState === 'complete') return res();
      var t = setTimeout(res, 3000);
      p.onicegatheringstatechange = function () { if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); } };
    });
  }

  async function onOffer(m) {
    gotOffer = true; clearInterval(helloTimer);
    if (pc) try { pc.close(); } catch (x) {}
    pc = new RTCPeerConnection({ iceServers: [{ urls: STUN }] });
    pc.ondatachannel = function (e) {
      dc = e.channel;
      dc.onopen = function () {
        st('Đã kết nối TV', true);
        $('pick').classList.remove('dis'); $('cam').disabled = false;
      };
      dc.onclose = function () { st('Mất kết nối, quét lại mã QR trên TV'); };
    };
    await pc.setRemoteDescription(m.sdp);
    tr = pc.getTransceivers().filter(function (t) { return t.receiver.track.kind === 'video'; })[0];
    if (tr) tr.direction = 'sendonly';
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce(pc);
    await pub({ t: 'answer', sdp: pc.localDescription });
  }

  sub(function (m) { if (m.t === 'offer') onOffer(m).catch(function (e) { st('Lỗi: ' + e.message); }); });
  function hello() { pub({ t: 'hello' }).catch(function () { st('Không có mạng'); }); }
  setTimeout(hello, 800);
  helloTimer = setInterval(function () { if (!gotOffer) hello(); }, 5000);

  // ----- gửi file -----
  function toJpeg(f) {
    return new Promise(function (res, rej) {
      var img = new Image(), u = URL.createObjectURL(f);
      img.onload = function () {
        var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        c.toBlob(function (b) { URL.revokeObjectURL(u); b ? res(b) : rej(new Error('convert')); }, 'image/jpeg', 0.92);
      };
      img.onerror = function () { rej(new Error('Không đọc được ảnh')); };
      img.src = u;
    });
  }
  async function sendFile(f) {
    var blob = f, name = f.name, type = f.type;
    var isImg = /^image\//.test(type) || /\.(heic|heif)$/i.test(name);
    if (isImg && !/jpeg|png|webp|gif/.test(type)) {
      blob = await toJpeg(f); type = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg';
    }
    dc.send(JSON.stringify({ t: 'file', name: name, type: type, size: blob.size }));
    for (var o = 0; o < blob.size; o += 16384) {
      while (dc.bufferedAmount > 1048576) await sleep(20);
      dc.send(await blob.slice(o, o + 16384).arrayBuffer());
      $('pr').firstChild.style.width = Math.round(o * 100 / blob.size) + '%';
    }
    dc.send(JSON.stringify({ t: 'end' }));
    $('pr').firstChild.style.width = '100%';
  }
  $('file').onchange = async function (e) {
    var list = Array.prototype.slice.call(e.target.files), n = 0;
    for (var i = 0; i < list.length; i++) {
      try { await sendFile(list[i]); n++; $('sent').textContent = 'Đã gửi ' + n + '/' + list.length; }
      catch (x) { st('Lỗi gửi: ' + x.message); }
    }
    e.target.value = '';
  };

  // ----- camera trực tiếp -----
  async function startCam() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 } }, audio: false });
    var t = stream.getVideoTracks()[0];
    await tr.sender.replaceTrack(t);
    $('pv').srcObject = stream; $('pv').hidden = false;
    $('flip').hidden = $('off').hidden = false; $('cam').hidden = true;
  }
  $('cam').onclick = function () { startCam().catch(function (e) { st('Lỗi camera: ' + e.message); }); };
  $('flip').onclick = function () { facing = facing === 'user' ? 'environment' : 'user'; startCam().catch(function (e) { st('Lỗi: ' + e.message); }); };
  $('off').onclick = async function () {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    await tr.sender.replaceTrack(null);
    $('pv').hidden = $('flip').hidden = $('off').hidden = true; $('cam').hidden = false;
  };
})();
</script>
</body>
</html>
